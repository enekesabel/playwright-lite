name: Reconcile README with main

on:
  push:
    branches:
      - docs/generated-readme-compatibility

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/generated-readme-compatibility
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge main
        run: |
          cp compatibility/api.ts "$RUNNER_TEMP/api.ts"
          git fetch origin main
          git merge --no-commit --no-ff origin/main || true
          python .github/reconcile-readme.py "$RUNNER_TEMP/api.ts"
          git add .prettierignore AGENTS.md compatibility/api.ts
          unresolved=$(git diff --name-only --diff-filter=U)
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge conflicts:"
            echo "$unresolved"
            exit 1
          fi
          git add -A
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:readme
      - run: pnpm exec prettier --write AGENTS.md README.hbs compatibility/api.ts scripts/generate-readme.mjs scripts/generate-readme.test.mjs README.md
      - run: node --test scripts/generate-readme.test.mjs
      - run: pnpm check
      - run: git diff --check
      - name: Commit merge
        run: |
          git rm .github/workflows/merge-main-readme.yml .github/reconcile-readme.py
          git add -A
          git commit -m "Merge main into generated README compatibility"
          git push origin HEAD:docs/generated-readme-compatibility
