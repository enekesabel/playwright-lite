name: Pointer diagnostic verification
on:
  push:
    branches: [codex/pointer-action-parity]
permissions:
  contents: write
concurrency:
  group: pointer-diagnostic-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7
        with:
          enable-cache: true
      - name: Verify invoked-method errors inside Devbox
        run: |
          devbox run -- bash -euo pipefail <<'SH'
          proof="$RUNNER_TEMP/pointer-diagnostics"
          mkdir -p "$proof"
          exec > >(tee "$proof/check.log") 2>&1
          git rev-parse HEAD > "$proof/head.txt"
          npm install --prefix "$RUNNER_TEMP/pnpm" pnpm@11.24.0
          export PATH="$RUNNER_TEMP/pnpm/node_modules/.bin:$PATH"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm build
          pnpm exec node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          const browser = await chromium.launch();
          const observed = [];
          try {
            const page = await browser.newPage();
            for (const method of ['check', 'uncheck', 'setChecked']) {
              await page.setContent('<button>go</button>');
              const locator = page.locator('button');
              const handle = await page.$('button');
              const calls = [
                ['page', () => method === 'setChecked' ? page.setChecked('button', true) : page[method]('button')],
                ['locator', () => method === 'setChecked' ? locator.setChecked(true) : locator[method]()],
                ['elementHandle', () => method === 'setChecked' ? handle.setChecked(true) : handle[method]()],
              ];
              for (const [kind, call] of calls) {
                const error = await call().then(() => null, error => error);
                assert(error && error.message.startsWith(`${kind}.${method}:`), `${kind}.${method}: ${error?.message}`);
                observed.push(error.message);
              }
              await page.setContent(`<input type="checkbox" disabled ${method === 'uncheck' ? 'checked' : ''}>`);
              const target = page.locator('input');
              const error = await (method === 'setChecked' ? target.setChecked(true, {timeout: 50}) : target[method]({timeout: 50})).then(() => null, error => error);
              assert(error && error.message.startsWith(`locator.${method}:`));
              assert(error.message.includes('Timeout 50ms exceeded'));
              observed.push(error.message);
            }
            writeFileSync(process.env.RUNNER_TEMP + '/pointer-diagnostics/native-errors.json', JSON.stringify(observed, null, 2));
            console.log('Pinned Playwright confirmed all 12 invoked-method error prefixes.');
          } finally { await browser.close(); }
          JS
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pointerActions.test.ts')
          s = p.read_text()
          marker = 'describe("pointer action compatibility", () => {'
          assert s.count(marker) == 1
          case = '''
            it.each(["check", "uncheck", "setChecked"] as const)(
              "reports the invoked checked method: %s",
              async (method) => {
                document.body.innerHTML = "<button>go</button>";
                const page = createPage();
                const locator = page.locator("button");
                const handle = (await page.$("button"))!;
                const calls = [
                  ["page", () => method === "setChecked" ? page.setChecked("button", true) : page[method]("button")],
                  ["locator", () => method === "setChecked" ? locator.setChecked(true) : locator[method]()],
                  ["elementHandle", () => method === "setChecked" ? handle.setChecked(true) : handle[method]()],
                ] as const;
                for (const [kind, call] of calls) {
                  const error = await call().then(() => null, (error: Error) => error);
                  expect(error).toBeInstanceOf(Error);
                  expect(error!.message.startsWith(`${kind}.${method}:`)).toBe(true);
                  expect(error!.message).toContain("Not a checkbox");
                }
                document.body.innerHTML = `<input type="checkbox" disabled ${method === "uncheck" ? "checked" : ""}>`;
                const target = page.locator("input");
                const pending = method === "setChecked" ? target.setChecked(true, { timeout: 50 }) : target[method]({ timeout: 50 });
                const error = await pending.then(() => null, (error: Error) => error);
                expect(error).toBeInstanceOf(Error);
                expect(error!.message.startsWith(`locator.${method}:`)).toBe(true);
                expect(error!.message).toContain("Timeout 50ms exceeded");
              }
            );
          '''
          p.write_text(s.replace(marker, marker + '\n' + case))
          PY
          pnpm exec prettier --write src/pointerActions.test.ts
          set +e
          pnpm exec vitest run src/pointerActions.test.ts -t 'reports the invoked checked method' --reporter=json --outputFile="$proof/red.json"
          result=$?
          set -e
          test "$result" = 1
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pointer-diagnostics/red.json').read_text())
          cases = [case for suite in report['testResults'] for case in suite['assertionResults'] if case['status'] == 'failed']
          assert report['numFailedTests'] == 3 and len(cases) == 3
          assert all('reports the invoked checked method' in case['fullName'] for case in cases)
          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, (path, old)
              p.write_text(s.replace(old, new))
          replace('src/page.ts', '    checked?: boolean\n  ): Promise<void> {', '    checked?: boolean,\n    apiMethod: "click" | "dblclick" | "hover" | "check" | "uncheck" | "setChecked" = action\n  ): Promise<void> {')
          replace('src/page.ts', ': `locator.${action}`;', ': `locator.${apiMethod}`;')
          replace('src/page.ts', '    options: CheckedActionOptions = {},\n    deadline = this.createActionDeadline(options.timeout)\n  ): Promise<void> {', '    options: CheckedActionOptions = {},\n    deadline = this.createActionDeadline(options.timeout),\n    apiMethod: "check" | "uncheck" | "setChecked" = "setChecked"\n  ): Promise<void> {')
          replace('src/page.ts', '      deadline,\n      checked\n    );', '      deadline,\n      checked,\n      apiMethod\n    );')
          for method, value in [('check', 'true'), ('uncheck', 'false')]:
              replace('src/locator.ts', f'''    await this.ownerPage.setCheckedSelector(this.selector, {value}, this.label, {{
                ...options,
                strict: true,
              }});'''.replace('                ', '      ').replace('              ', '    '), f'''    await this.ownerPage.setCheckedSelector(
                this.selector,
                {value},
                this.label,
                {{ ...options, strict: true }},
                undefined,
                "{method}"
              );''')
          PY
          pnpm exec prettier --write src/page.ts src/locator.ts src/pointerActions.test.ts
          pnpm build
          pnpm lint
          pnpm typecheck
          pnpm upstream:check
          pnpm test
          pnpm test:guards
          pnpm test:evaluation
          pnpm test:package
          rm .github/workflows/pointer-diagnostics.yml
          pnpm format:check
          git restore -- .github/workflows/pointer-diagnostics.yml
          git diff --check
          git diff > "$proof/verified.patch"
          touch "$proof/checks-passed"
          SH
      - name: Commit the verified diagnostic fix
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          devbox run -- bash -euo pipefail <<'SH'
          test "$GITHUB_REF_NAME" = codex/pointer-action-parity
          test -f "$RUNNER_TEMP/pointer-diagnostics/checks-passed"
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == {'src/page.ts', 'src/locator.ts', 'src/pointerActions.test.ts'}, changed
          PY
          git add src/page.ts src/locator.ts src/pointerActions.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: retain invoked locator method in checked-action errors'
          authorization=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/codex/pointer-action-parity
          git rev-parse HEAD > "$RUNNER_TEMP/pointer-diagnostics/verified-head.txt"
          SH
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pointer-diagnostics-proof
          path: ${{ runner.temp }}/pointer-diagnostics
          if-no-files-found: error
