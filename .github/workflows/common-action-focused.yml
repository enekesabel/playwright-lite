name: Common action focused

on:
  push:
    branches: [compat/common-action-parity]
    paths: [.github/workflows/common-action-focused.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Run new exact upstream specs
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/common-action-focused.json
        run: >-
          pnpm exec playwright test --reporter=list,json --timeout=30000
          tests/upstream/page-focus.spec.ts
          tests/upstream/page-select-option.spec.ts
          tests/upstream/elementhandle-press.spec.ts
          tests/upstream/elementhandle-type.spec.ts
          tests/upstream/elementhandle-scroll-into-view.spec.ts
          tests/upstream/elementhandle-select-text.spec.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: common-action-focused
          path: test-results/common-action-focused.json
          if-no-files-found: error
