name: Pointer parity workbench
on:
  push:
    branches: [codex/pointer-action-parity]
permissions:
  contents: write
concurrency:
  group: pointer-parity-workbench
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7
        with:
          enable-cache: true
      - name: Promote reviewed evidence and run the complete check inside Devbox
        run: |
          devbox run -- bash -euo pipefail <<'SH'
          mkdir -p "$RUNNER_TEMP/pointer-proof"
          exec > >(tee "$RUNNER_TEMP/pointer-proof/check.log") 2>&1
          git rev-parse HEAD > "$RUNNER_TEMP/pointer-proof/head.txt"
          trap 'cp test-results/compatibility.json "$RUNNER_TEMP/pointer-proof/compatibility.json" 2>/dev/null || true; tar --exclude="./.git" --exclude="./node_modules" --exclude="./.devbox" --exclude="./test-results" --exclude="./playwright-report" --exclude="./src/__screenshots__" -czf "$RUNNER_TEMP/pointer-proof/repository.tgz" .' EXIT
          npm install --prefix "$RUNNER_TEMP/pnpm" pnpm@11.24.0
          export PATH="$RUNNER_TEMP/pnpm/node_modules/.bin:$PATH"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          python3 scripts/pointer-workbench.py
          python3 scripts/pointer-runtime.py
          python3 scripts/pointer-polish.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('tsconfig.compatibility.json')
          config = json.loads(path.read_text())
          config['include'].append('src/virtual-modules.d.ts')
          path.write_text(json.dumps(config, indent=2) + '\n')
          assets = ['input/animating-button.html', 'input/scrollable.html', 'input/textarea.html', 'input/checkbox.html', 'input/rotatedButton.html', 'shadow.html', 'offscreenbuttons.html', 'wrappedlink.html', 'counter.html', 'frames/frameset.html', 'frames/frame.html']
          path = Path('.prettierignore')
          path.write_text(path.read_text().rstrip() + '\n# Exact pinned upstream pointer fixtures.\n' + ''.join('tests/assets/' + name + '\n' for name in assets))
          PY
          pnpm exec prettier --write AGENTS.md src/page.ts src/locator.ts src/elementHandle.ts src/contract.test.ts src/pointerActions.test.ts compatibility/api.ts compatibility/pointer-signatures.ts tsconfig.compatibility.json tests/upstream/corpus.ts tests/upstream/pageTest.ts tests/upstream/testServer.ts
          pnpm build
          pnpm lint
          pnpm typecheck
          pnpm test
          python3 scripts/pointer-promote.py
          rm .github/workflows/pointer-workbench.yml scripts/pointer-workbench.py scripts/pointer-runtime.py scripts/pointer-polish.py scripts/pointer-promote.py
          pnpm check
          git diff --check
          git diff --stat > "$RUNNER_TEMP/pointer-proof/diff-stat.txt"
          git diff > "$RUNNER_TEMP/pointer-proof/verified.patch"
          touch "$RUNNER_TEMP/pointer-proof/full-check-passed"
          SH
      - name: Commit only the verified changes to the working branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          devbox run -- bash -euo pipefail <<'SH'
          test "$GITHUB_REF_NAME" = codex/pointer-action-parity
          test -f "$RUNNER_TEMP/pointer-proof/full-check-passed"
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import subprocess
          allowed = {'.prettierignore', 'AGENTS.md', 'src/page.ts', 'src/locator.ts', 'src/elementHandle.ts', 'src/contract.test.ts', 'src/pointerActions.test.ts', 'compatibility/api.ts', 'tsconfig.compatibility.json', 'tests/upstream/corpus.ts', 'tests/upstream/pageTest.ts', 'tests/upstream/testServer.ts', 'tests/upstream/baseline.json', '.github/workflows/pointer-workbench.yml', 'scripts/pointer-workbench.py', 'scripts/pointer-runtime.py', 'scripts/pointer-polish.py', 'scripts/pointer-promote.py'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed <= allowed, changed - allowed
          PY
          # The connected GitHub app removes this temporary workflow after the
          # verified source push; the Actions token only commits source files.
          git restore -- .github/workflows/pointer-workbench.yml
          git add -u
          git add compatibility/pointer-signatures.ts
          git add tests/upstream/page-click.spec.ts tests/upstream/elementhandle-click.spec.ts tests/upstream/page-click-scroll.spec.ts tests/upstream/page-click-timeout-1.spec.ts tests/upstream/page-click-timeout-2.spec.ts tests/upstream/page-click-timeout-3.spec.ts tests/upstream/page-click-timeout-4.spec.ts
          git add tests/assets/input/button.html tests/assets/input/mouse-helper.js tests/assets/input/animating-button.html tests/assets/input/scrollable.html tests/assets/input/textarea.html tests/assets/input/checkbox.html tests/assets/input/rotatedButton.html tests/assets/shadow.html tests/assets/offscreenbuttons.html tests/assets/wrappedlink.html tests/assets/counter.html tests/assets/frames/frameset.html tests/assets/frames/frame.html
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: improve browser-local pointer actions with reviewed upstream coverage'
          authorization=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/codex/pointer-action-parity
          git rev-parse HEAD > "$RUNNER_TEMP/pointer-proof/verified-head.txt"
          git status --short > "$RUNNER_TEMP/pointer-proof/final-status.txt"
          SH
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pointer-proof
          path: ${{ runner.temp }}/pointer-proof
          if-no-files-found: error
