name: Verify package cleanup
on:
  push:
    branches: [work/package-interface-cleanup]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9d449e0a00d5bb521eb3b4faf213ba257c24432b
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the committed changes
        run: |
          git diff --exit-code 468d499a9f3f34561b6005b756bba66dc64f88e7 -- src/page.ts src/locator.ts src/elementHandle.ts src/injected.ts build tests/upstream/baseline.json
          if git grep -n -i -E 'ayme|ayde|b25d782|@ayme-dev' -- .; then exit 1; fi
          git diff --stat 468d499a9f3f34561b6005b756bba66dc64f88e7
      - uses: jetify-com/devbox-install-action@1af623155b1203817421a7efe5574f59f4a055c6
        with:
          devbox-version: 0.18.0
          refresh-cli: true
          enable-cache: false
          disable-nix-access-token: true
      - name: Verify the locked development environment
        run: |
          devbox run -- node -e 'require("node:assert/strict").equal(process.version, "v24.12.0"); console.log(process.version)'
          devbox run -- node -e 'const v = require("node:child_process").execFileSync("pnpm", ["--version"], { encoding: "utf8" }).trim(); require("node:assert/strict").equal(v, "11.24.0"); console.log(v)'
          git diff --exit-code -- devbox.json devbox.lock
