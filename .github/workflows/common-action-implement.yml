name: Common action implement

on:
  push:
    branches: [compat/common-action-parity]
    paths: [.github/workflows/common-action-implement.yml]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: compat/common-action-parity
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - name: Apply workbench
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/common-action-workbench.py')
          text = path.read_text()
          text = text.replace(
              '    if count != 1:\n        raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")\n    file.write_text(text.replace(old, new, 1))',
              '    if count > 1:\n        raise SystemExit(f"{path}: expected at most one match, found {count}: {old[:80]!r}")\n    if count == 0:\n        print(f"skip already-covered transform: {old[:50]!r}")\n        return\n    file.write_text(text.replace(old, new, 1))'
          )
          path.write_text(text)
          PY
          python3 scripts/common-action-workbench.py
      - run: pnpm prettier --write src/page.ts src/locator.ts
      - name: Typecheck
        run: pnpm typecheck 2>&1 | tee typecheck.log
      - name: Unit tests
        run: pnpm test 2>&1 | tee test.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: common-action-workbench
          path: |
            typecheck.log
            test.log
            src/page.ts
            src/locator.ts
          if-no-files-found: error
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/page.ts src/locator.ts
          git commit -m "feat: add common action cancellation and press delay"
          git push
