name: Common action implement

on:
  push:
    branches: [compat/common-action-parity]
    paths: [.github/workflows/common-action-implement.yml]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: compat/common-action-parity
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/common-action-workbench.py
      - run: pnpm prettier --write src/page.ts src/locator.ts
      - run: pnpm typecheck
      - run: pnpm test
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/page.ts src/locator.ts
          git commit -m "feat: add common action cancellation and press delay"
          git push
