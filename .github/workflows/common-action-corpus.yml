name: Common action corpus

on:
  push:
    branches: [compat/common-action-parity]
    paths: [.github/workflows/common-action-corpus.yml]

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: compat/common-action-parity
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Sync exact pinned upstream specs
        run: pnpm upstream:sync
      - name: Commit synced corpus
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/upstream/corpus.ts tests/upstream/*.spec.ts
          git commit -m "test: expand common action upstream corpus"
          git push
      - run: pnpm build
      - name: Run compatibility corpus diagnostically
        continue-on-error: true
        run: pnpm baseline:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: common-action-compatibility
          path: test-results/compatibility.json
          if-no-files-found: error
