name: README review validation

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: readme-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    if: github.head_ref == 'docs/generated-readme-compatibility' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - name: Inspect official documentation and pinned upstream
        run: |
          mkdir -p "$RUNNER_TEMP/readme-review"
          curl --fail --silent --show-error https://playwright.dev/docs/api/class-page > "$RUNNER_TEMP/readme-review/page.html"
          curl --fail --silent --show-error https://playwright.dev/docs/api/class-locator > "$RUNNER_TEMP/readme-review/locator.html"
          curl --fail --silent --show-error https://raw.githubusercontent.com/microsoft/playwright/26a9e470a7b3c7822084b09fb7f13902c5f37b51/packages/playwright-core/src/client/elementHandle.ts > "$RUNNER_TEMP/readme-review/upstream-elementHandle.ts"
          curl --fail --silent --show-error https://raw.githubusercontent.com/microsoft/playwright/26a9e470a7b3c7822084b09fb7f13902c5f37b51/packages/playwright-core/src/server/fileUploadUtils.ts > "$RUNNER_TEMP/readme-review/upstream-fileUploadUtils.ts"
      - run: pnpm generate:readme
      - run: pnpm exec prettier --write AGENTS.md compatibility/api.ts scripts/generate-readme.mjs scripts/generate-readme.test.mjs
      - run: node --test scripts/generate-readme.test.mjs
      - run: pnpm check:readme && pnpm generate:injected && pnpm typecheck
      - name: Commit verified generated output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md AGENTS.md compatibility/api.ts scripts/generate-readme.mjs scripts/generate-readme.test.mjs
          git diff --cached --quiet || git commit -m 'docs: render reviewed API compatibility notes and links'
          git push origin HEAD:docs/generated-readme-compatibility
      - name: Export validation files
        if: always()
        run: |
          cp README.md README.hbs AGENTS.md "$RUNNER_TEMP/readme-review/"
          cp scripts/generate-readme.mjs scripts/generate-readme.test.mjs "$RUNNER_TEMP/readme-review/"
          cp compatibility/api.ts "$RUNNER_TEMP/readme-review/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: readme-review
          path: ${{ runner.temp }}/readme-review/
          retention-days: 1
