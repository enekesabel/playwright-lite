# Temporary verification workflow; remove before merge.
name: Abort signal bridge

on:
  push:
    branches: [compat/common-action-parity]
    paths: [.github/workflows/abort-bridge.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: compat/common-action-parity
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Relax delegated check signal assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/contract.test.ts")
          text = path.read_text()
          old = ".rejects.toThrow(/check signal must be an AbortSignal/);"
          new = ".rejects.toThrow(/signal must be an AbortSignal/);"
          if text.count(old) != 1:
              raise SystemExit(f"expected one assertion to replace, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - run: pnpm prettier --write src/contract.test.ts
      - run: pnpm test
      - name: Commit verified assertion fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/contract.test.ts
          git commit -m "test: align delegated signal validation assertion"
          git push
