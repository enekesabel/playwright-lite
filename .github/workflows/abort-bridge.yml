# Temporary verification workflow; remove before PR.
name: Abort signal bridge

on:
  push:
    branches: [compat/common-action-parity]
    paths: [.github/workflows/abort-bridge.yml]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: compat/common-action-parity
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/common-action-fixups.py
      - run: python3 scripts/abort-bridge-workbench.py
      - run: pnpm prettier --write src/page.ts src/locator.ts tests/upstream/adapter-bridge.ts
      - run: pnpm typecheck
      - name: Unit tests
        run: pnpm test 2>&1 | tee test.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: abort-signal-debug
          path: |
            test.log
            src/page.ts
            src/locator.ts
            tests/upstream/adapter-bridge.ts
          if-no-files-found: error
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Exact upstream AbortSignal cases
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/abort-signal.json
        run: >-
          pnpm exec playwright test tests/upstream/page-click.spec.ts
          --grep "abort|signal"
          --reporter=list,json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: abort-signal-upstream
          path: test-results/abort-signal.json
          if-no-files-found: ignore
      - name: Commit verified signal work
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/page.ts src/locator.ts tests/upstream/adapter-bridge.ts
          git commit -m "feat: complete common action cancellation parity"
          git push
