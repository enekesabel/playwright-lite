name: README format diagnose

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'docs/generated-readme-compatibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - name: Compare generator and CLI Prettier output
        run: |
          pnpm generate:readme
          cp README.md "$RUNNER_TEMP/generated.md"
          pnpm exec prettier --write README.md
          if cmp -s README.md "$RUNNER_TEMP/generated.md"; then
            echo 'Generator output is already a Prettier fixed point.'
          else
            echo 'CLI Prettier changes generator output:'
            diff -u "$RUNNER_TEMP/generated.md" README.md || true
          fi
          echo 'Checking whether generator accepts the CLI-formatted output:'
          pnpm check:readme || true
