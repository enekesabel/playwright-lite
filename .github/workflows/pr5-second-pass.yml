name: PR 5 second pass

on:
  push:
    branches: [codex/browser-compat-wins]
    paths: [.github/workflows/pr5-second-pass.yml]

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/browser-compat-wins
          fetch-depth: 0
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7
        with:
          enable-cache: "true"
          disable-nix-access-token: "true"
      - name: Promote reviewed cases
        run: |
          devbox run -- bash -euo pipefail <<'SHELL'
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';

          const promotions = [
            { id: 'elementhandle-convenience.spec.ts > innerText should throw', method: 'ElementHandle.innerText', evidence: 'The unchanged test resolves an SVG ElementHandle through the browser adapter and asserts ElementHandle.innerText rejects with the same Node-is-not-an-HTMLElement diagnostic; Page.setContent is setup only.' },
            { id: 'elementhandle-convenience.spec.ts > isVisible should not throw when the DOM element is not connected', method: 'Page.isVisible', evidence: 'The unchanged regression test churns the target in requestAnimationFrame and awaits Page.isVisible ten times without rejection. Every Page.isVisible call enters the browser adapter; Page.setContent is setup only.' },
            { id: 'elementhandle-convenience.spec.ts > isEditable should work', method: 'ElementHandle.isEditable', evidence: 'The unchanged assertions verify disabled input, enabled input and readonly textarea editability through both ElementHandle.isEditable and Page.isEditable. ElementHandle calls execute through adapter handles; Page.setContent is setup only.' },
            { id: 'elementhandle-convenience.spec.ts > isChecked should work', method: 'ElementHandle.isChecked', evidence: 'The unchanged assertions verify a checked handle becomes unchecked after an adapter ElementHandle.evaluate mutation, with matching Page.isChecked results and invalid-target diagnostics. ElementHandle.isChecked executes through the adapter.' },
            { id: 'locator-misc-2.spec.ts > should waitFor hidden', method: 'Locator.waitFor', evidence: 'The unchanged test starts Locator.waitFor({ state: hidden }), removes the child through adapter Page.$eval, and proves the wait completes. Locator.waitFor and hidden-state polling execute through the browser adapter; Page.setContent is setup only.' },
            { id: 'page-keyboard.spec.ts > pressing Meta should not result in any text insertion on any platform', method: 'Keyboard.press', evidence: 'The unchanged assertions prove the input value remains hello world before and after adapter Keyboard.press(Meta). Focus, keyboard dispatch and matcher checks all execute through the browser adapter; Page.setContent is setup only.' },
            { id: 'page-keyboard.spec.ts > should type repeatedly in input in shadow dom', method: 'Locator.type', evidence: 'The unchanged test types two different strings into inputs inside an open shadow root and asserts each resulting inputValue exactly. Locator.type and inputValue execute through the browser adapter; Page.setContent is setup only.' },
            { id: 'page-keyboard.spec.ts > type to non-focusable element should maintain old focus', method: 'Locator.type', evidence: 'The unchanged test focuses one element, types through Locator.type on a non-focusable non-editable element, and asserts document.activeElement remains the original element. Locator.type and both page evaluations execute through the browser adapter.' },
            { id: 'selectors-misc.spec.ts > should properly determine visibility of display:contents elements', method: 'Page.waitForSelector', evidence: 'The unchanged regression test exercises five display:contents DOM shapes and proves Page.waitForSelector resolves for the visible cases and for state:hidden when the element has no rendered content. All waitForSelector state checks execute through the adapter; Page.setContent is setup only.' }
          ];

          const before = JSON.parse(readFileSync('tests/upstream/baseline.json', 'utf8'));
          if (before.reviewed.length !== 278) throw new Error(`Expected 278 reviewed entries before second pass, got ${before.reviewed.length}`);
          const beforeIds = new Set(before.reviewed.map(entry => entry.id));
          execFileSync(process.execPath, ['scripts/upstream-baseline.mjs', 'promote', ...promotions.flatMap(({ id, method, evidence }) => [id, method, evidence])], { stdio: 'inherit' });
          const after = JSON.parse(readFileSync('tests/upstream/baseline.json', 'utf8'));
          if (after.reviewed.length !== 287) throw new Error(`Expected 287 reviewed entries after second pass, got ${after.reviewed.length}`);
          for (const id of beforeIds) if (!after.reviewed.some(entry => entry.id === id)) throw new Error(`Previous reviewed entry disappeared: ${id}`);
          for (const { id } of promotions) if (!after.reviewed.some(entry => entry.id === id)) throw new Error(`Promotion missing from baseline: ${id}`);
          NODE
          SHELL
      - name: Full verification
        run: |
          set -o pipefail
          devbox run -- pnpm check 2>&1 | tee /tmp/pr5-second-pass.log
          devbox run -- git diff --check 2>&1 | tee -a /tmp/pr5-second-pass.log
      - name: Preserve verification output
        if: always()
        run: |
          cp /tmp/pr5-second-pass.log pr5-second-pass.log 2>/dev/null || true
          cp tests/upstream/baseline.json second-pass-baseline.json 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr5-second-pass-${{ github.run_id }}
          path: |
            pr5-second-pass.log
            second-pass-baseline.json
      - name: Commit verified baseline and remove temporary workflow
        run: |
          set -euo pipefail
          git fetch origin codex/browser-compat-wins
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/browser-compat-wins)"
          git rm .github/workflows/pr5-second-pass.yml
          git add tests/upstream/baseline.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: promote 9 additional reviewed compatibility cases'
          git push origin HEAD:codex/browser-compat-wins
