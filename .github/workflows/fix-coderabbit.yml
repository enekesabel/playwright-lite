name: Apply review fixes
on:
  push:
    branches: [work/coderabbit-fixes]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/coderabbit-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.24.0
      - run: node scripts/fix-coderabbit.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm format
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Commit clean result
        shell: bash
        run: |
          rm scripts/fix-coderabbit.mjs .github/workflows/fix-coderabbit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: address compatibility review findings'
          git push origin HEAD:work/coderabbit-fixes
