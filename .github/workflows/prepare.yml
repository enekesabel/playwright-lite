name: Package preparation
on:
  push:
    branches: [work/standalone-package]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/standalone-package
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.24.0
      - name: Apply standalone changes
        run: node scripts/prepare-standalone.mjs
      - run: pnpm install --no-frozen-lockfile
      - name: Generate pinned stock implementation and synchronize tests
        run: |
          pnpm generate:injected
          pnpm upstream:sync
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const artifact = readFileSync('build/generated/injectedScriptSource.ts');
          const path = 'build/playwrightInjectedPlugin.ts';
          let text = readFileSync(path, 'utf8');
          text = text.replace(/const expectedArtifactBytes = [\d_]+;/, `const expectedArtifactBytes = ${artifact.length};`);
          text = text.replace(/const expectedArtifactSha256 =\s*"[a-f0-9]+";/, `const expectedArtifactSha256 = "${createHash('sha256').update(artifact).digest('hex')}";`);
          writeFileSync(path, text);
          JS
      - run: pnpm format
      - name: Save prepared tree on temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'refactor: configure standalone browser runtime'
          git push origin HEAD:work/standalone-package
          git rev-parse HEAD
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm lint && pnpm typecheck
      - run: pnpm upstream:check
      - run: pnpm test
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-results
          path: test-results/*.json
          if-no-files-found: ignore
