name: README review follow-up

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'docs/generated-readme-compatibility'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - name: Apply review follow-up
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              expected = 1 if count is None else count
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {actual}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              "README.hbs",
              'const page = createPage();',
              '''const page = createPage({
            testIdAttribute: "data-test",
            actionTimeout: 5_000,
            navigationTimeout: 10_000,
          });''',
          )
          replace(
              "README.hbs",
              '\n`createPage()` accepts `testIdAttribute` (default `data-testid`), `actionTimeout` (1,000 ms), and `navigationTimeout` (30,000 ms). Set a timeout to `0` to disable it. Configuration is per page; `playwright.config.ts` is not loaded.\n',
              '',
          )
          replace(
              "README.hbs",
              '[^element-handle]: {{{elementHandleLimitations}}}',
              '### ElementHandle compatibility\n\n{{{elementHandleLimitations}}}',
          )

          replace(
              "compatibility/api.ts",
              'Returned `ElementHandle` methods and options differ; see the exact differences.[^element-handle]',
              'Returned `ElementHandle` methods and options differ; see [ElementHandle compatibility](#elementhandle-compatibility).',
              5,
          )

          p = Path("scripts/generate-readme.mjs")
          text = p.read_text()
          old = '''// These inherited members have no individual Playwright documentation page.
          const undocumentedMembers = new Set([
            "Symbol.asyncDispose",
            "addListener",
            "off",
            "on",
            "once",
            "prependListener",
            "removeListener",
          ]);'''
          new = '''const specialMemberUrls = new Map([
            ["Symbol.asyncDispose", "https://playwright.dev/docs/release-notes#version-160"],
            ["addListener", "https://playwright.dev/docs/events"],
            ["off", "https://playwright.dev/docs/events"],
            ["on", "https://playwright.dev/docs/events"],
            ["once", "https://playwright.dev/docs/events"],
            ["prependListener", "https://playwright.dev/docs/events"],
            ["removeListener", "https://playwright.dev/docs/events"],
          ]);'''
          if text.count(old) != 1:
              raise SystemExit("generate-readme.mjs: special-member block changed")
          text = text.replace(old, new)
          old = '''      return {
                  name,
                  url: undocumentedMembers.has(name)
                    ? null
                    : `https://playwright.dev/docs/api/class-${owner}#${owner}-${anchor}`,'''
          new = '''      return {
                  name,
                  label: key === Symbol.asyncDispose ? "[Symbol.asyncDispose]()" : name,
                  url:
                    specialMemberUrls.get(name) ??
                    `https://playwright.dev/docs/api/class-${owner}#${owner}-${anchor}`,'''
          if text.count(old) != 1:
              raise SystemExit("generate-readme.mjs: row URL block changed")
          p.write_text(text.replace(old, new))

          replace(
              "README.hbs",
              '| {{#if url}}[`{{name}}`]({{{url}}}){{else}}`{{name}}`{{/if}} | {{status}} | {{{note}}} |',
              '| {{#if url}}[`{{label}}`]({{{url}}}){{else}}`{{label}}`{{/if}} | {{status}} | {{{note}}} |',
          )

          p = Path("scripts/generate-readme.test.mjs")
          text = p.read_text()
          text = text.replace(
              'assert.match(row("Symbol.asyncDispose"), /\\|\\s*❌\\s*\\|\\s*\\|$/u);',
              'assert.match(row("[Symbol.asyncDispose]()"), /\\|\\s*❌\\s*\\|\\s*\\|$/u);',
          )
          text = text.replace(
              '  assert.ok(readme.indexOf("### Locator") < readme.indexOf("## License"));',
              '  assert.ok(readme.indexOf("### Locator") < readme.indexOf("### ElementHandle compatibility"));\n  assert.ok(\n    readme.indexOf("### ElementHandle compatibility") < readme.indexOf("## License")\n  );\n  assert.doesNotMatch(readme, /\\[\\^element-handle\\]/);\n  assert.match(readme, /const page = createPage\\(\\{[\\s\\S]*testIdAttribute: "data-test"/);\n  assert.doesNotMatch(readme, /`createPage\\(\\)` accepts/);',
          )
          text = text.replace(
              '  assert.match(readme, /^\\|\\s*`off`\\s*\\|/m);\n  assert.match(readme, /^\\|\\s*`Symbol\\.asyncDispose`\\s*\\|/m);',
              '''  for (const name of [
            "addListener",
            "off",
            "on",
            "once",
            "prependListener",
            "removeListener",
          ]) {
            assert.ok(
              readme.includes(`[\\`${name}\\`](https://playwright.dev/docs/events)`),
              name
            );
          }
          assert.ok(
            readme.includes(
              "[\\`[Symbol.asyncDispose]()\\`](https://playwright.dev/docs/release-notes#version-160)"
            )
          );''',
          )
          text = text.replace(
              'key === Symbol.asyncDispose ? "Symbol.asyncDispose" : String(key)',
              'key === Symbol.asyncDispose ? "[Symbol.asyncDispose]()" : String(key)',
          )
          if text == p.read_text():
              raise SystemExit("generate-readme.test.mjs: no changes applied")
          p.write_text(text)
          PY
      - run: pnpm generate:readme
      - run: pnpm exec prettier --write README.hbs compatibility/api.ts scripts/generate-readme.mjs scripts/generate-readme.test.mjs README.md
      - run: node --test scripts/generate-readme.test.mjs
      - run: pnpm check:readme
      - run: pnpm generate:injected && pnpm typecheck
      - run: git diff --check
      - name: Commit follow-up
        run: |
          git rm .github/workflows/readme-review-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.hbs README.md compatibility/api.ts scripts/generate-readme.mjs scripts/generate-readme.test.mjs
          git commit -m "docs: address README review follow-up"
          git push origin HEAD:${{ github.head_ref }}
