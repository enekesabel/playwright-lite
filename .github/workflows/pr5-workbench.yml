name: PR 5 workbench

on:
  push:
    branches: [codex/browser-compat-wins]
    paths:
      - .github/workflows/pr5-workbench.yml
      - scripts/pr5-workbench.py

permissions:
  contents: write
  actions: write

concurrency:
  group: pr5-workbench
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/browser-compat-wins
          fetch-depth: 0
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7
        with:
          enable-cache: "true"
          disable-nix-access-token: "true"
      - name: Promote reviewed cases and run all checks in Devbox
        id: verify
        run: |
          devbox run -- bash -euo pipefail <<'SHELL'
          python3 scripts/pr5-workbench.py
          echo "prepared=true" >> "$GITHUB_OUTPUT"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm format
          pnpm build
          pnpm test:guards
          node scripts/upstream-specs.mjs check --upstream
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, mkdirSync, copyFileSync } from 'node:fs';
          const baselinePath = 'tests/upstream/baseline.json';
          const original = JSON.parse(execFileSync('git', ['show', '673fb1090dc2497a06db99f366075ad923f6227d:' + baselinePath], { encoding: 'utf8' }));
          const before = JSON.parse(readFileSync(baselinePath, 'utf8'));
          assert.deepEqual(before.reviewed, original.reviewed, 'Existing reviewed entries changed before promotion');
          // Each entry was reviewed against its complete pinned source and the
          // recorded adapter execution in workbench runs 34721584326/34722113062.
          // These explicit approvals are not inferred from passing status.
          const reviews = [
            { id: 'page-localstorage.spec.ts > localStorage.items returns empty array on fresh origin', method: 'Page.localStorage.items', evidence: 'After explicitly recorded native origin setup, the browser storage wrapper returns an empty array for a fresh origin. This certifies storage enumeration, not Page.goto.' },
            { id: 'page-localstorage.spec.ts > localStorage.getItem returns null for missing key', method: 'Page.localStorage.getItem', evidence: 'The unchanged toBeNull assertion checks that the browser storage wrapper returns null for an absent key; native goto only establishes the origin.' },
            { id: 'page-localstorage.spec.ts > localStorage.setItem persists and surfaces in items()/getItem()', method: 'Page.localStorage.setItem', evidence: 'The unchanged assertions verify both written name/value pairs without imposing key order, getItem(alpha) equals 1, and browser evaluation reads the same persisted value. Storage writes and reads enter the adapter; native goto is setup only.' },
            { id: 'page-localstorage.spec.ts > localStorage.setItem overwrites existing value', method: 'Page.localStorage.setItem', evidence: 'After two browser-adapter writes to k, getItem(k) returns second, proving overwrite rather than duplicate entries. Native goto only establishes the origin.' },
            { id: 'page-localstorage.spec.ts > localStorage.removeItem removes a single item', method: 'Page.localStorage.removeItem', evidence: 'After adapter writes of a and b, removeItem(a) leaves exactly b=2 in items(). This proves selective deletion; recorded native goto is setup only.' },
            { id: 'page-localstorage.spec.ts > localStorage.clear empties storage', method: 'Page.localStorage.clear', evidence: 'After two adapter writes, clear() is followed by an unchanged items() assertion of an empty array. All storage operations are browser-side; native goto is setup only.' },
            { id: 'page-localstorage.spec.ts > sessionStorage round-trip', method: 'Page.sessionStorage.setItem', evidence: 'The unchanged test checks empty enumeration, both written values, getItem, selective removal and final clear through the browser sessionStorage wrapper. Native goto establishes the origin and is not certified.' },
            { id: 'page-localstorage.spec.ts > localStorage and sessionStorage are independent', method: 'Page.sessionStorage.getItem', evidence: 'The same key has distinct local and session values; clearing local storage leaves the session value intact. All storage methods enter the adapter and native goto is setup only.' },
            { id: 'page-localstorage.spec.ts > storage methods are scoped to the current origin', method: 'Page.localStorage.getItem', evidence: 'Across three explicitly recorded native setup navigations, the second origin starts empty and returning to the first recovers origin-1 rather than origin-2. Adapter storage calls prove origin scoping, not navigation support.' },
            { id: 'elementhandle-convenience.spec.ts > isVisible and isHidden should work', method: 'ElementHandle.isVisible', evidence: 'The unchanged assertions check visible div and empty span handle results for both isVisible and isHidden, with corresponding Page and missing-selector checks. Handle state methods execute in the adapter; native setContent only sets up the document.' },
            { id: 'elementhandle-convenience.spec.ts > isEnabled and isDisabled should work', method: 'ElementHandle.isEnabled', evidence: 'The unchanged assertions verify both enabled/disabled booleans for a div, a disabled button and an enabled button. Actual handle methods enter the browser adapter; native setContent is setup only.' },
            { id: 'elementhandle-convenience.spec.ts > isEnabled and isDisabled should work with <select/> option/optgroup correctly', method: 'ElementHandle.isDisabled', evidence: 'The unchanged assertions verify complementary enabled/disabled results for ordinary and disabled options and optgroups through adapter handles. Native setContent only establishes the controls.' },
            { id: 'locator-highlight.spec.ts > highlight should accept a CSS string style', method: 'Locator.highlight', evidence: 'The unchanged test observes a visible overlay and reads its actual inline outline and background color after a CSS-string highlight. Highlight, matcher and evaluate calls enter the adapter; native navigation/context creation are setup only. Pinned test mode exposes the overlay shadow root.' },
            { id: 'locator-highlight.spec.ts > highlight should accept an object style (JS only)', method: 'Locator.highlight', evidence: 'The unchanged test observes a visible overlay and verifies the actual dashed blue outline and camelCase backgroundColor from an object style. Runtime highlight, matcher and evaluation execute in the browser; native navigation/context calls are setup and teardown. Pinned test mode only exposes the shadow root.' },
            { id: 'locator-highlight.spec.ts > hideHighlight removes a styled highlight', method: 'Locator.hideHighlight', evidence: 'The unchanged test first proves the styled overlay is visible, then invokes adapter Locator.hideHighlight and asserts zero overlays through the adapter matcher. Native navigation/context calls only establish and dispose the document; pinned test mode exposes the shadow root.' },
            { id: 'locator-highlight.spec.ts > Page.hideHighlight clears all locator highlights', method: 'Page.hideHighlight', evidence: 'The unchanged test highlights two different buttons, proves there are two overlays, invokes adapter Page.hideHighlight and asserts zero overlays. Both count assertions use the browser adapter; native context/setContent calls are setup only and pinned test mode exposes the shadow root.' },
          ];
          assert.equal(reviews.length, 16);
          execFileSync(process.execPath, ['scripts/upstream-baseline.mjs', 'promote', ...reviews.flatMap(({ id, method, evidence }) => [id, method, evidence])], { stdio: 'inherit' });
          const after = JSON.parse(readFileSync(baselinePath, 'utf8'));
          assert.equal(after.reviewed.length, original.reviewed.length + reviews.length);
          for (const entry of original.reviewed) assert.deepEqual(after.reviewed.find(e => e.id === entry.id), entry);
          for (const entry of reviews) assert.deepEqual(after.reviewed.find(e => e.id === entry.id), entry);
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const originalPkg = JSON.parse(execFileSync('git', ['show', '673fb1090dc2497a06db99f366075ad923f6227d:package.json'], { encoding: 'utf8' }));
          for (const field of ['exports', 'dependencies', 'devDependencies', 'peerDependencies']) assert.deepEqual(pkg[field], originalPkg[field]);
          execFileSync('git', ['diff', '--exit-code', '673fb1090dc2497a06db99f366075ad923f6227d', '--', 'src/index.ts']);
          const output = process.env.RUNNER_TEMP + '/pr5';
          mkdirSync(output, { recursive: true });
          copyFileSync('test-results/compatibility.json', output + '/promotion-execution.json');
          console.log(`Reviewed baseline: ${original.reviewed.length} preserved + ${reviews.length} new = ${after.reviewed.length}; no exports or dependencies added.`);
          NODE
          pnpm check
          git diff --check
          SHELL
      - name: Publish verified baseline and remove temporary workbench
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin codex/browser-compat-wins
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/browser-compat-wins)"
          git rm .github/workflows/pr5-workbench.yml scripts/pr5-workbench.py
          git add src tests AGENTS.md .prettierignore scripts/upstream-specs.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "test: promote 16 reviewed upstream browser compatibility cases"
          git push origin HEAD:codex/browser-compat-wins
          gh workflow run ci.yml --ref codex/browser-compat-wins
      - name: Preserve verification artifacts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pr5"
          git diff > "$RUNNER_TEMP/pr5/uncommitted.diff"
          git rev-parse HEAD > "$RUNNER_TEMP/pr5/head.txt"
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/pr5/repository.tgz"
          if [ -d test-results ]; then cp -R test-results "$RUNNER_TEMP/pr5/"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr5-workbench-${{ github.run_id }}
          path: ${{ runner.temp }}/pr5
          if-no-files-found: error
