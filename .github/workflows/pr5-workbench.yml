name: PR 5 workbench

on:
  push:
    branches: [codex/browser-compat-wins]
    paths:
      - .github/workflows/pr5-workbench.yml
      - scripts/pr5-workbench.py

permissions:
  contents: write
  actions: write

concurrency:
  group: pr5-workbench
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/browser-compat-wins
          fetch-depth: 0
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7
        with:
          enable-cache: "true"
          disable-nix-access-token: "true"
      - name: Apply and verify in one Devbox shell
        id: verify
        run: |
          devbox run -- bash -euo pipefail <<'SHELL'
          python3 scripts/pr5-workbench.py
          echo "prepared=true" >> "$GITHUB_OUTPUT"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm format
          pnpm build
          pnpm lint
          pnpm typecheck
          node scripts/upstream-specs.mjs check --upstream
          pnpm test
          pnpm test:guards
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createRequire } from 'node:module';
          import { resolve } from 'node:path';
          import { parseReport, validateReportErrors, validateCompleteness, isCandidate } from './scripts/upstream-baseline.mjs';
          const require = createRequire(import.meta.url);
          const names = ['page-localstorage.spec.ts', 'locator-highlight.spec.ts', 'elementhandle-convenience.spec.ts'];
          const reportPath = resolve('test-results/pr5-focused.json');
          const run = spawnSync(process.execPath, [require.resolve('@playwright/test/cli'), 'test', '--reporter=list,json', ...names.map(name => `tests/upstream/${name}`)], {
            stdio: 'inherit', env: { ...process.env, PLAYWRIGHT_JSON_OUTPUT_NAME: reportPath },
          });
          assert(!run.error && !run.signal && [0, 1].includes(run.status), 'Focused runner failed');
          const report = JSON.parse(readFileSync(reportPath, 'utf8'));
          assert.deepEqual(validateReportErrors(report), []);
          const entries = parseReport(report);
          assert.deepEqual(validateCompleteness(entries, names).errors, []);
          writeFileSync('test-results/pr5-focused-evidence.json', JSON.stringify(entries, null, 2) + '\n');
          for (const entry of entries) console.log(JSON.stringify(entry));
          const required = entries.filter(entry => entry.file !== 'elementhandle-convenience.spec.ts' || [
            'elementhandle-convenience.spec.ts > isVisible and isHidden should work',
            'elementhandle-convenience.spec.ts > isEnabled and isDisabled should work',
            'elementhandle-convenience.spec.ts > isEnabled and isDisabled should work with <select/> option/optgroup correctly',
          ].includes(entry.id));
          assert.equal(required.length, 16);
          for (const entry of required) assert(isCandidate(entry), `Unverified new behavior: ${entry.id}`);
          console.log('All 16 required new upstream cases have clean browser execution. No promotion performed.');
          NODE
          git diff --check
          SHELL
      - name: Publish changes without overwriting concurrent work
        if: always() && steps.verify.outputs.prepared == 'true'
        env:
          VERIFIED: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          git fetch origin codex/browser-compat-wins
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/browser-compat-wins)"
          git add src tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m "fix: initialize highlight test mode lazily ($VERIFIED)"
            git push origin HEAD:codex/browser-compat-wins
          fi
      - name: Preserve verification artifacts
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pr5"
          git diff > "$RUNNER_TEMP/pr5/uncommitted.diff"
          git rev-parse HEAD > "$RUNNER_TEMP/pr5/head.txt"
          git ls-files -z | tar --null -T - -czf "$RUNNER_TEMP/pr5/repository.tgz"
          if [ -d test-results ]; then cp -R test-results "$RUNNER_TEMP/pr5/"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr5-workbench-${{ github.run_id }}
          path: ${{ runner.temp }}/pr5
          if-no-files-found: error
