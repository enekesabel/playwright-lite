name: README preparation

on:
  pull_request:

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'docs/generated-readme-compatibility'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm generate:readme
      - run: pnpm exec prettier --write compatibility/api.ts scripts/generate-readme.mjs scripts/generate-readme.test.mjs AGENTS.md package.json
      - name: Commit generated output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md compatibility/api.ts scripts/generate-readme.mjs scripts/generate-readme.test.mjs AGENTS.md package.json
          git diff --cached --quiet || git commit -m 'docs: render README from compatibility ledger'
          git push origin HEAD:docs/generated-readme-compatibility
      - run: node --test scripts/generate-readme.test.mjs
      - run: pnpm check:readme
      - run: pnpm generate:injected && pnpm typecheck
      - name: Export generated source
        if: always()
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: generated-source
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
