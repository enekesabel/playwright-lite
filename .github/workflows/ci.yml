name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a release between creating its tag and publishing to npm.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          target-branch: main

  check:
    needs: release-please
    # PRs/manual runs skip Release Please; a skipped controller must not suppress CI.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ needs.release-please.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Release Please can observe a merge newer than this workflow's push.
          # Build the actual release commit, not a moving branch or stale push.
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      # The squash merge makes the PR title the commit on main that Release Please reads.
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      # vitest runs Chromium in-process for src/**/*.test.ts; headless shell is enough since
      # everything here runs headless.
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm check
      - name: Pack the verified build
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error

  corpus:
    name: Corpus
    needs: release-please
    # PRs/manual runs skip Release Please; a skipped controller must not suppress CI.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Build the same commit "check" builds.
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --only-shell chromium
      # The corpus harness loads dist/index.mjs.
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compatibility-results
          path: test-results/*.json
          if-no-files-found: ignore

  consumer-node20:
    name: Packed consumer on Node 20.0.0
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Verify package installation and declarations with the lower bound
        env:
          PLAYWRIGHT_VERSION: 1.29.1
        run: node scripts/packed-consumer.mjs "$RUNNER_TEMP/package/"*.tgz
      - name: Install Chromium for the runtime verification
        run: npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Verify the package and browser runtime with the current Playwright
        env:
          PLAYWRIGHT_VERSION: 1.62.1
        run: node scripts/packed-consumer.mjs "$RUNNER_TEMP/package/"*.tgz

  publish-npm:
    name: Publish npm
    needs: [release-please, check, corpus, consumer-node20]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Publish the verified tarball
        id: publish
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        shell: bash
        run: |
          tarballs=("$RUNNER_TEMP/package/"*.tgz)
          if [[ ${#tarballs[@]} -ne 1 || ! -f "${tarballs[0]}" ]]; then
            echo "::error::Expected exactly one verified package tarball."
            exit 1
          fi
          tarball="${tarballs[0]}"
          tar -xOf "$tarball" package/package.json | node -e '
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync(0, "utf8"));
            assert.equal(pkg.name, "@enekesabel/playwright-lite");
            assert.equal(pkg.version, process.env.RELEASE_VERSION);
            assert.match(pkg.version, /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/);
          '
          npm publish "$tarball" --registry https://registry.npmjs.org --access public --ignore-scripts
