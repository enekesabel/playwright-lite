name: README preparation

on:
  pull_request:

permissions:
  contents: read

jobs:
  prepare:
    if: github.head_ref == 'docs/generated-readme-compatibility'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - name: Export pinned declarations
        run: cp node_modules/playwright-core/types/types.d.ts "$RUNNER_TEMP/playwright-types.d.ts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readme-reference
          path: ${{ runner.temp }}/playwright-types.d.ts
          retention-days: 1
