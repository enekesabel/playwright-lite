name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a release between creating its tag and publishing to npm.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-please:
    name: Release Please
    if: github.repository == 'enekesabel/playwright-lite' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          target-branch: main

  check:
    needs: release-please
    # PRs/manual runs skip Release Please; a skipped controller must not suppress CI.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ needs.release-please.outputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release Please can observe a merge newer than this workflow's push.
          # Build the actual release commit, not a moving branch or stale push.
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      # The squash merge makes the PR title the commit on main that Release Please reads.
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      # vitest runs Chromium in-process for src/**/*.test.ts; headless shell is enough since
      # everything here runs headless.
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm check
      - name: Pack the verified build
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error

  corpus-shard:
    name: Corpus shard ${{ matrix.shard }}
    needs: release-please
    # PRs/manual runs skip Release Please; a skipped controller must not suppress CI.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One shard's infrastructure failure must not hide the other shards' verdicts.
      fail-fast: false
      matrix:
        # Keep this list in sync with CORPUS_SHARD_TOTAL in the "Corpus" job.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the same commit "check" builds.
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --only-shell chromium
      # The corpus harness loads dist/index.mjs.
      - run: pnpm build
      # `tests/upstream/[^_]` is the corpus: every upstream spec except the
      # underscore-prefixed harness guards, which "Corpus" runs once. The
      # reporter list and the timeout have to be given here because the CLI
      # replaces the configured reporters, and because the baseline check runs
      # the corpus with the same 15s timeout.
      - name: Run corpus shard ${{ matrix.shard }}
        shell: bash
        run: |
          set +e
          pnpm exec playwright test \
            --shard=${{ matrix.shard }}/${{ strategy.job-total }} \
            --timeout=15000 \
            --reporter=blob,list \
            'tests/upstream/[^_]'
          status=$?
          set -e
          # Corpus failures are expected; the merged report is what gets judged.
          # Only 0 (all passed) and 1 (some tests failed) are a completed run.
          if [[ $status -ne 0 && $status -ne 1 ]]; then
            echo "::error::Playwright exited with unexpected status $status (runner/config failure)."
            exit $status
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: corpus-blob-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error

  corpus:
    name: Corpus
    needs: [release-please, corpus-shard]
    # PRs/manual runs skip Release Please; a skipped controller must not suppress CI.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Keep in sync with the shard matrix above.
      CORPUS_SHARD_TOTAL: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the same commit "check" builds.
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
      - run: npm install --global pnpm@11.24.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --only-shell chromium
      # The corpus harness loads dist/index.mjs.
      - run: pnpm build
      # Before the merge: a Playwright run clears test-results/, where the
      # merged report goes.
      - run: pnpm test:guards
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: corpus-blob-*
          path: ${{ runner.temp }}/blob-reports
          merge-multiple: true
      # merge-reports merges whatever it finds, so a shard that crashed before
      # uploading would silently shrink the corpus. The selectedTestCount guard
      # in the baseline check would catch it too; this says why.
      - name: Require one blob report per shard
        shell: bash
        run: |
          blobs=("$RUNNER_TEMP/blob-reports/"*.zip)
          if [[ ! -f "${blobs[0]}" || ${#blobs[@]} -ne $CORPUS_SHARD_TOTAL ]]; then
            echo "::error::Expected $CORPUS_SHARD_TOTAL shard blob reports, found ${#blobs[@]}. A corpus shard crashed or uploaded nothing."
            exit 1
          fi
      - name: Merge the shard reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/report.json
        run: pnpm exec playwright merge-reports --reporter=json "$RUNNER_TEMP/blob-reports"
      - run: node scripts/upstream-baseline.mjs check --report test-results/report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compatibility-results
          path: test-results/*.json
          if-no-files-found: ignore

  consumer-node20:
    name: Packed consumer on Node 20.0.0
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Verify package installation and declarations with the lower bound
        env:
          PLAYWRIGHT_VERSION: 1.29.1
        run: node scripts/packed-consumer.mjs "$RUNNER_TEMP/package/"*.tgz
      - name: Install Chromium for the runtime verification
        run: npx --yes playwright@1.62.1 install --with-deps chromium
      - name: Verify the package and browser runtime with the current Playwright
        env:
          PLAYWRIGHT_VERSION: 1.62.1
        run: node scripts/packed-consumer.mjs "$RUNNER_TEMP/package/"*.tgz

  publish-npm:
    name: Publish npm
    needs: [release-please, check, corpus, consumer-node20]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Publish the verified tarball
        id: publish
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        shell: bash
        run: |
          tarballs=("$RUNNER_TEMP/package/"*.tgz)
          if [[ ${#tarballs[@]} -ne 1 || ! -f "${tarballs[0]}" ]]; then
            echo "::error::Expected exactly one verified package tarball."
            exit 1
          fi
          tarball="${tarballs[0]}"
          tar -xOf "$tarball" package/package.json | node -e '
            const assert = require("node:assert/strict");
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync(0, "utf8"));
            assert.equal(pkg.name, "@enekesabel/playwright-lite");
            assert.equal(pkg.version, process.env.RELEASE_VERSION);
            assert.match(pkg.version, /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/);
          '
          npm publish "$tarball" --registry https://registry.npmjs.org --access public --ignore-scripts
