name: Pointer secondary-button verification
on:
  push:
    branches: [codex/pointer-action-parity]
permissions:
  contents: write
concurrency:
  group: pointer-secondary-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7
        with:
          enable-cache: true
      - name: Verify secondary double clicks against pinned Playwright inside Devbox
        run: |
          devbox run -- bash -euo pipefail <<'SH'
          proof="$RUNNER_TEMP/pointer-secondary"
          mkdir -p "$proof"
          exec > >(tee "$proof/check.log") 2>&1
          git rev-parse HEAD > "$proof/head.txt"
          npm install --prefix "$RUNNER_TEMP/pnpm" pnpm@11.24.0
          export PATH="$RUNNER_TEMP/pnpm/node_modules/.bin:$PATH"
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm build
          pnpm exec node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            await page.setContent('<button>go</button>');
            await page.evaluate(() => {
              window.events = [];
              document.addEventListener('contextmenu', event => event.preventDefault());
              document.querySelector('button').addEventListener('dblclick', event => window.events.push(event.button));
            });
            await page.dblclick('button', { button: 'right' });
            await page.locator('button').dblclick({ button: 'middle' });
            await (await page.$('button')).dblclick();
            const events = await page.evaluate(() => window.events);
            assert.deepEqual(events, [0]);
            writeFileSync(process.env.RUNNER_TEMP + '/pointer-secondary/native-events.json', JSON.stringify(events));
            console.log('Pinned Playwright observed only the primary dblclick:', events);
          } finally {
            await browser.close();
          }
          JS
          python3 - <<'PY'
          from pathlib import Path
          import json
          assert len(json.loads(Path('tests/upstream/baseline.json').read_text())['reviewed']) == 368
          assert not Path('scripts/pointer-runtime.py').exists()
          p = Path('src/pointerActions.test.ts')
          s = p.read_text()
          marker = 'describe("pointer action compatibility", () => {'
          assert s.count(marker) == 1
          case = '''
            it("dispatches dblclick only for the primary button", async () => {
              document.body.innerHTML = "<button>go</button>";
              const page = createPage();
              const events: number[] = [];
              const button = document.querySelector("button")!;
              button.addEventListener("contextmenu", (event) => event.preventDefault());
              button.addEventListener("dblclick", (event) => events.push(event.button));
              await page.dblclick("button", { button: "right" });
              await page.locator("button").dblclick({ button: "middle" });
              await (await page.$("button"))!.dblclick();
              expect(events).toEqual([0]);
            });
          '''
          p.write_text(s.replace(marker, marker + '\n' + case))
          PY
          pnpm exec prettier --write src/pointerActions.test.ts
          set +e
          pnpm exec vitest run src/pointerActions.test.ts -t 'dispatches dblclick only for the primary button' --reporter=json --outputFile="$proof/red.json"
          result=$?
          set -e
          test "$result" = 1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pointer-secondary/red.json').read_text())
          assert data['numFailedTests'] == 1
          cases = [case for suite in data['testResults'] for case in suite['assertionResults'] if case['status'] == 'failed']
          assert len(cases) == 1 and 'dispatches dblclick only for the primary button' in cases[0]['fullName']
          assert any('to deeply equal' in message for message in cases[0]['failureMessages'])
          p = Path('src/page.ts')
          s = p.read_text()
          assert s.count('if (detail === 2)') == 1
          p.write_text(s.replace('if (detail === 2)', 'if (detail === 2 && button === 0)'))
          PY
          pnpm exec prettier --write src/page.ts
          pnpm build
          pnpm lint
          pnpm typecheck
          pnpm upstream:check
          pnpm test
          pnpm test:guards
          pnpm test:evaluation
          pnpm test:package
          rm .github/workflows/pointer-secondary.yml
          pnpm format:check
          git restore -- .github/workflows/pointer-secondary.yml
          git diff --check
          git diff > "$proof/verified.patch"
          touch "$proof/checks-passed"
          SH
      - name: Commit the minimal verified correction
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          devbox run -- bash -euo pipefail <<'SH'
          test "$GITHUB_REF_NAME" = codex/pointer-action-parity
          test -f "$RUNNER_TEMP/pointer-secondary/checks-passed"
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == {'src/page.ts', 'src/pointerActions.test.ts'}, changed
          PY
          git add src/page.ts src/pointerActions.test.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: emit double-click events only for primary mouse button'
          authorization=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $authorization" push origin HEAD:refs/heads/codex/pointer-action-parity
          git rev-parse HEAD > "$RUNNER_TEMP/pointer-secondary/verified-head.txt"
          SH
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pointer-secondary-proof
          path: ${{ runner.temp }}/pointer-secondary
          if-no-files-found: error
